{{- if .Values.toolbox.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: co2watch-toolbox
  namespace: {{ include "co2watch.ns" . }}
  labels:
    {{- include "co2watch.labels" . | nindent 4 }}
    app.kubernetes.io/component: toolbox
spec:
  replicas: 1
  strategy:
    type: Recreate          # never two pods on the volume during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: co2watch
      app.kubernetes.io/component: toolbox
  template:
    metadata:
      labels:
        {{- include "co2watch.labels" . | nindent 8 }}
        app.kubernetes.io/component: toolbox
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "co2watch.podSpecCommon" . | nindent 6 }}
      initContainers:
        - name: init-db
          {{- include "co2watch.containerCommon" . | nindent 10 }}
          args: ["init-db", "--db", "$(DB)"]
      containers:
        - name: toolbox
          {{- include "co2watch.containerCommon" . | nindent 10 }}
          {{- if .Values.web.enabled }}
          # The toolbox also serves the status page (`co2watch serve`); kubectl exec
          # into it works as before. Readiness only, no liveness probe, so a slow
          # page never restarts the pod under an open exec session.
          args: ["serve", "--db", "$(DB)", "--vm", "$(VM_URL)", "--source", "$(VM_SOURCE)",
                 "--port", "{{ .Values.web.port }}", "--cache-seconds", "{{ .Values.web.cacheSeconds }}",
                 "--score-every", "{{ .Values.web.scoreEverySeconds }}"]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          {{- else }}
          command: ["sleep", "infinity"]
          {{- end }}
          resources:
            {{- toYaml .Values.toolbox.resources | nindent 12 }}
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: co2watch-web
  namespace: {{ include "co2watch.ns" . }}
  labels:
    {{- include "co2watch.labels" . | nindent 4 }}
    app.kubernetes.io/component: toolbox
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app.kubernetes.io/name: co2watch
    app.kubernetes.io/component: toolbox
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
{{- end }}
{{- end }}
